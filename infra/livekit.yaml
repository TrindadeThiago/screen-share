# Configuração do LiveKit (nó único, sem Redis). Chaves vêm de LIVEKIT_KEYS no compose.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
turn:
  enabled: true
  domain: turn.screenshare.example.com # troque pelo seu domínio (o LiveKit não expande variáveis)
  tls_port: 5349 # o Caddy/porta 443 pode ser configurado como fallback (ver infra/README.md)
  udp_port: 3478
prometheus_port: 6789
logging:
  level: info
