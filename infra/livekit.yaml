# Configuração do LiveKit (nó único, sem Redis). Chaves vêm de LIVEKIT_KEYS no compose.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
# TURN só em UDP. TURN/TLS exige domínio e certificado próprios (ver infra/README.md);
# sem eles, redes restritas ainda entram pelo fallback TCP na 7881.
turn:
  enabled: true
  udp_port: 3478
  # Portas por onde o TURN repassa a mídia; precisam estar publicadas no compose e no firewall.
  relay_range_start: 50101
  relay_range_end: 50200
prometheus:
  port: 6789
logging:
  level: info
