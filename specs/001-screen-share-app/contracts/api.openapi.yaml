openapi: 3.0.3
info: {title: Screen Share API, version: 0.1.0}
paths:
  /rooms:
    post:
      summary: Cria sala (FR-001, FR-002, FR-022)
      parameters:
        - {name: x-server-key, in: header, required: false, schema: {type: string}, description: Obrigatória quando o servidor define ROOM_CREATION_KEY}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 32}
                password: {type: string, minLength: 4, maxLength: 64}
                maxParticipants: {type: integer, minimum: 2, maximum: 10, default: 10}
                expiresInMinutes: {type: integer, minimum: 15, maximum: 1440, default: 720}
      responses:
        '201':
          description: Sala criada, já com token para o criador
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinResult'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}   # chave do servidor ausente ou errada
        '429': {$ref: '#/components/responses/Error'}
  /rooms/{code}/token:
    post:
      summary: Entra em sala existente (FR-003, FR-004, FR-005)
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 32}
                password: {type: string}
                rejoinToken: {type: string, description: Token anterior desta sala; mantém a identidade na reentrada}
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinResult'}
        '401': {$ref: '#/components/responses/Error'}   # senha inválida
        '404': {$ref: '#/components/responses/Error'}   # código inexistente
        '409': {$ref: '#/components/responses/Error'}   # sala lotada
        '410': {$ref: '#/components/responses/Error'}   # sala expirada
        '429': {$ref: '#/components/responses/Error'}
  /rooms/{code}/broadcast:
    post:
      summary: Pede a vez de transmitir a tela (um transmissor por vez)
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenProof'}
      responses:
        '204': {description: Permissão concedida a quem pediu}
        '401': {$ref: '#/components/responses/Error'}   # token inválido ou fora da sala
        '409': {$ref: '#/components/responses/Error'}   # outra pessoa está transmitindo
  /rooms/{code}/broadcast/stop:
    post:
      summary: Devolve a vez de transmitir
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenProof'}
      responses:
        '204': {description: Permissão devolvida}
        '401': {$ref: '#/components/responses/Error'}
  /config:
    get:
      summary: Endereço do servidor de mídia
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [mediaUrl]
                properties:
                  mediaUrl: {type: string, example: 'wss://live.example.com'}
components:
  schemas:
    TokenProof:
      type: object
      required: [token]
      properties:
        token: {type: string, description: Token recebido ao entrar nesta sala}
    JoinResult:
      type: object
      required: [code, serverUrl, token, expiresAt]
      properties:
        code: {type: string, example: ABCD-EFGH-JKLM-NPQR}
        serverUrl: {type: string, description: URL wss do servidor de mídia}
        token: {type: string}
        expiresAt: {type: string, format: date-time, description: expiração da sala}
  responses:
    Error:
      description: Erro
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error: {type: string, enum: [invalid_request, wrong_password, room_not_found, room_full, room_expired, server_key_required, invalid_token, broadcast_busy, rate_limited, server_error]}
              message: {type: string, description: mensagem legível em português}
