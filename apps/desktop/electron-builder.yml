appId: com.screenshare.app
productName: ScreenShare
directories:
  output: release
# O app não tem módulos nativos e o Vite já empacota as dependências em dist/. Sem isto, o
# electron-builder reinstala só as de produção e, num workspace npm, apaga as de build da raiz.
npmRebuild: false
files:
  - dist/**
  - package.json
win:
  target:
    - target: portable
      arch: [x64]
  requestedExecutionLevel: asInvoker
  artifactName: ScreenShare-portable.exe
portable:
  artifactName: ScreenShare-portable.exe
linux:
  executableName: screenshare
  target:
    - target: AppImage
      arch: [x64]
  category: Network
  artifactName: ScreenShare.AppImage
